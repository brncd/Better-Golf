<!-- favicon.svg — Golf App hoyo grande 3D hundido (gradiente) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fondo blanco -->
  <rect width="64" height="64" rx="12" fill="#fff"/>

  <!-- Definimos gradiente radial para efecto de profundidad -->
  <defs>
    <radialGradient id="holeGradient" cx="32" cy="32" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111"/> <!-- centro más oscuro -->
      <stop offset="50%" stop-color="#222"/> <!-- intermedio -->
      <stop offset="100%" stop-color="#555"/> <!-- borde más claro -->
    </radialGradient>
  </defs>

  <!-- Hoyo con gradiente -->
  <ellipse cx="32" cy="32" rx="24" ry="12" fill="url(#holeGradient)"/>
</svg>
